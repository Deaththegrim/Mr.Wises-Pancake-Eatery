<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pancake Shop</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body>
  <header id="hud">
    <span id="hud-title"></span>
    <span id="hud-day"></span>
    <span id="hud-money"></span>
    <span id="hud-rep"></span>
    <span id="hud-quota"></span>
  </header>

  <main>
    <section id="screen-title" class="screen active">
      <h1 id="title-text" tabindex="-1"></h1>
      <p class="muted">A pancake shop, and the tired god who keeps coming back.</p>
      <button id="btn-new">New Game</button>
      <button id="btn-continue">Continue</button>
    </section>

    <section id="screen-morning" class="screen">
      <h2 tabindex="-1">Morning</h2>
      <p class="muted">Choose what goes on the menu today. Early on, a short menu of
        your best work earns more. As you unlock more dishes, breadth starts to pay —
        people order what they came for.</p>
      <div id="menu-picker" class="card"></div>
      <div id="stock-warning"></div>
      <button id="btn-open">Open the shop</button>
    </section>

    <section id="screen-service" class="screen">
      <h2 tabindex="-1">Service</h2>
      <!-- The room, as the player has furnished it. Placeholder shapes
           until the sprites named by each item's `art` field exist. -->
      <div id="shopfront-decor"></div>
      <div id="customer-card"></div>
      <div id="griddle-mount"></div>
      <!-- The till. Shows the last dish's itemised bill and stays up until
           the next one is served, so the player can actually read what
           they earned instead of watching it flash past in a notice. -->
      <div id="receipt" role="status" aria-live="polite"></div>
      <button id="btn-close">Close for the day</button>
    </section>

    <section id="screen-evening" class="screen">
      <h2 tabindex="-1">Evening</h2>
      <div id="ledger"></div>
      <!-- What the till is for, late on. Cosmetic only: never reputation. -->
      <div id="decor-shop"></div>
      <button id="btn-research">Research</button>
      <button id="btn-next-day">Next day</button>
    </section>

    <section id="screen-research" class="screen">
      <h2 tabindex="-1">Research</h2>
      <div id="tree-mount"></div>
      <div id="bench-mount"></div>
      <button id="btn-back-evening">Back</button>
    </section>

    <section id="screen-ending" class="screen">
      <h2 id="ending-title" tabindex="-1"></h2>
      <p class="muted" id="ending-summary"></p>
      <button id="btn-restart">Open again</button>
    </section>

    <section id="screen-vn" class="screen">
      <div id="vn-stage"><img id="vn-sprite" alt=""></div>
      <div id="vn-box">
        <div id="vn-name"></div>
        <div id="vn-text"></div>
        <div id="vn-choices"></div>
      </div>
    </section>
  </main>

  <div id="notice" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
